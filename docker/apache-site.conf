# Mirrors the nginx site that scripts/install-garageos.sh writes: serve
# public/ only, send unknown paths to index.php, never serve dotfiles.
<VirtualHost *:${PORT}>
    DocumentRoot /var/www/garageos/public

    <Directory /var/www/garageos/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        FallbackResource /index.php
    </Directory>

    <FilesMatch "^\.(?!well-known)">
        Require all denied
    </FilesMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
